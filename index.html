<style>

*{box-sizing:border-box}
/* ince, yuvarlak, temaya uyumlu kaydırma çubukları */

html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header,.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--pn);border-bottom:1px solid var(--line);font-size:13px}
.bar{padding:6px 16px;color:var(--mut)}
.bar label,header label{display:flex;gap:5px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700}
button,.btn,select{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--pn);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--c1)}
button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.primary{background:var(--c1);color:#fff;border-color:var(--c1);font-weight:600}
.tabs{display:flex;gap:0}.tabs button{border-radius:0}.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0}

.sp{flex:1}
main{flex:1;display:grid;grid-template-columns:var(--sw,220px) auto 1fr;min-height:0}

#list{flex:1;overflow:auto}

.item.on{background:var(--c1b);color:#1d2433}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{display:none;gap:2px}.item:hover .ib,.item.on .ib{display:flex}
.ib button{padding:0 5px;font-size:12px}
#addb{margin:8px}

@media(max-width:860px){#rz{display:none}}
#q{width:calc(100% - 16px);margin:8px 8px 0}#fcnt{font-size:12px;color:var(--mut);padding:3px 10px 6px;min-height:20px}
::highlight(find){background:#ffd54a;color:#000}::highlight(findcur){background:#ff8a00;color:#000}
#chead{padding:8px 8px 0}#chead:empty{display:none}#back{width:100%;text-align:left}.cname{font-weight:700;font-size:14px;padding:8px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch{font-size:12px;color:var(--mut);padding:2px}.crs{padding:11px 8px;font-size:14px}.crs .cn2{font-size:11px;color:var(--mut);background:var(--bg);border-radius:9px;padding:1px 7px}.item.on.crs .cn2{background:#fff}
#src{width:340px;height:100%;resize:none;border:0;border-right:1px solid var(--line);padding:14px;font:13px/1.55 ui-monospace,Consolas,monospace;background:var(--pn);color:var(--ink);outline:none}
.noed #src{display:none}

#view{overflow:auto;padding:24px;min-width:0}
#drop{outline:3px dashed var(--c1);outline-offset:-10px}

.th-mono{--c1:#222;--c1b:#f5f5f5;--c2:#222;--c2b:#f5f5f5;--c3:#222;--c3b:#f5f5f5;--c4:#222;--c4b:#f5f5f5;--mk:#d4d4d4}
.th-mono .s1{border-left:8px solid #222}.th-mono .s2{border-left:6px dashed #222}.th-mono .s3{border-left:8px double #222}.th-mono .s4{border-left:6px dotted #222}
.th-mono .s1>.sh::before{content:"■ "}.th-mono .s2>.sh::before{content:"▲ "}.th-mono .s3>.sh::before{content:"◆ "}.th-mono .s4>.sh::before{content:"● "}

.dk .page code,.dk .page th{background:#2a303d}.dk .page .sh{background:#0003!important}
.doc-title{font-size:28px;font-weight:700;margin:0 0 4px}

.utitle{font-size:1.55em;font-weight:700;margin:0 0 6px;padding-bottom:8px;border-bottom:2px solid currentColor;line-height:1.25}
.unit+.unit{margin-top:30px;padding-top:24px;border-top:2px dashed #aab}
.page h1,.page h2,.page h3{line-height:1.3;margin:20px 0 8px}
.page h2{font-size:1.25em}.page h3{font-size:1.07em}
.page p{margin:6px 0}.page ul,.page ol{margin:6px 0;padding-left:22px}.page li{margin:5px 0;break-inside:avoid}
.page code{background:#f1f3f7;padding:1px 5px;border-radius:3px;font-size:.92em}

.page hr{border:0;border-top:1px solid #9994;margin:18px 0}
.cols .ubody{column-count:2;column-gap:8mm}.cols .sec{break-inside:avoid}
.sec{margin:16px 0;border:1px solid var(--cb);border-left:5px solid var(--c);border-radius:6px;background:var(--cb);padding:0 16px 10px}
.sec>.sh{margin:0 -16px 8px;padding:8px 16px;font-weight:700;font-size:1.06em;color:var(--c);border-bottom:1px solid var(--c);break-after:avoid;background:#fff6}
.s1{--c:var(--c1);--cb:var(--c1b)}.s2{--c:var(--c2);--cb:var(--c2b)}.s3{--c:var(--c3);--cb:var(--c3b)}.s4{--c:var(--c4);--cb:var(--c4b)}
mark{background:var(--mk);color:inherit;border-radius:2px;padding:0 1px}

.sec{border:0;border-left:5px solid var(--c);border-radius:4px 10px 10px 4px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent);padding-bottom:12px}

.empty::before{content:"📄";display:block;font-size:40px;margin-bottom:10px}
#cards{position:relative;border-top:4px solid var(--line);padding-top:16px}
#cards::before{content:"";position:absolute;top:-4px;left:0;height:4px;width:var(--p,0%);background:var(--c1);border-radius:2px;transition:width .3s}
#card{min-height:280px;border-radius:18px;box-shadow:0 10px 30px rgba(20,30,60,.10);animation:popA .25s ease-out}

@media print{.unit+.unit::before{display:none}.sec{box-shadow:none;border:1px solid var(--cb);border-left:5px solid var(--c)}.page{box-shadow:none;letter-spacing:0}}

<body>
<header>
 <h1>Sınav Notu → PDF</h1>
 <div id="hg1"><label class="btn">.md ekle<input id="file" type="file" accept=".md,.markdown,.txt" multiple hidden></label></div>
 <div class="tabs"><button data-t="not" class="on">Not</button><button data-t="quiz">Sınav</button><button data-t="cards">Kartlar</button></div>
 <div id="hg2"><input id="title" type="text" placeholder="Belge başlığı (isteğe bağlı)">

 <button id="gear" title="Ayarlar">⚙<span class="gl"> Ayarlar</span></button>

</header>
<div class="bar">
 <label><input type="checkbox" data-o="pn">Sayfa numarası</label>

  </div>
 </div>

<script>
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let courses=LS('courses',null),acId=LS('ac',null),docs,act=null;
const opt=Object.assign({pn:true,cols:false,pb:true,th:'color',fs:'14',sc:'auto',ed:true,dk:false,t:'',s:''},LS('opt',{}));
/* ---------- dersler: eski tek liste otomatik "Ders 1" olur ---------- */
if(!Array.isArray(courses)||!courses.length)courses=[{id:'c'+Date.now(),name:'Ders 1',docs:LS('docs',[]),act:LS('act',null),t:opt.t,s:opt.s}];
courses.forEach(c=>{if(!Array.isArray(c.docs))c.docs=[]});
if(!courses.some(c=>c.id===acId))acId=courses[0].id;
const crs=()=>courses.find(c=>c.id===acId);
docs=crs().docs;act=crs().act||null;opt.t=crs().t||'';opt.s=crs().s||'';
let smode=courses.length>1?'courses':'notes';
let tab='not',hlMode=false;

function mkUnit(d,i){
 const t=md2(d.md);let title=d.name;const h=t.querySelector('h1');if(h){title=h.textContent;h.remove()}
 const u=document.createElement('div');u.className='unit';u.id='u'+i;u.dataset.d=d.id;
 u.innerHTML='<h1 class="utitle"></h1><div class="ubody"></div>';
 u.firstChild.textContent=title;u.title0=title;
 const body=u.lastChild;let cur=null,k=0;
 const nodes=[...t.childNodes];
 const headOf=n=>/^H[1-4]$/.test(n.nodeName)||(n.nodeName==='P'&&n.textContent.trim().length<80&&!n.textContent.trim().includes('\n'));
 /* hiç emojili başlık yoksa H2 başlıklarını renkli kutu yap */
 const h2mode=!nodes.some(n=>headOf(n)&&secClass(n.textContent.trim(),0));
 nodes.forEach(n=>{
  const txt=n.textContent?n.textContent.trim():'';let cls=null;
  if(headOf(n))cls=secClass(txt,k);
  if(!cls&&h2mode&&n.nodeName==='H2'&&txt)cls='s'+(1+k%4);
  if(cls){cur=document.createElement('section');cur.className='sec '+cls;const sh=document.createElement('div');sh.className='sh';sh.id='u'+i+'s'+(k++);sh.textContent=txt;cur.appendChild(sh);body.appendChild(cur)}
  else if(/^H[1-3]$/.test(n.nodeName)||n.nodeName==='HR'){cur=null;body.appendChild(n)}
  else(cur||body).appendChild(n);
 });
 (d.hl||[]).forEach(txt=>{
  const w=document.createTreeWalker(u,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.parentElement.closest('mark'))continue;const p=n.nodeValue.indexOf(txt);if(p<0)continue;
   try{const r=document.createRange();r.setStart(n,p);r.setEnd(n,p+txt.length);const m=document.createElement('mark');m.dataset.t=txt;r.surroundContents(m)}catch(e){}break}
 });
 return u;
}

let deck=[],ci=0,flip=false,known=0;
function allCards(){
 const out=[];
 docs.filter(d=>d.inc).forEach(d=>{
  md2(d.md).querySelectorAll('li,:scope>p').forEach(e=>{
   const subs=[...e.querySelectorAll(':scope>ul>li,:scope>ol>li')].map(x=>x.textContent.trim());
   const c=e.cloneNode(true);c.querySelectorAll('ul,ol').forEach(x=>x.remove());
   const kid=[...c.childNodes].find(n=>n.textContent.trim());
   if(!kid||kid.nodeName!=='STRONG')return;
   let rest='';let n=kid.nextSibling;while(n){rest+=n.textContent;n=n.nextSibling}
   const ft=kid.textContent.trim();
   if(!/[:：=]$/.test(ft)&&!/^\s*[:：=]/.test(rest))return;
   let back=rest.replace(/^\s*[:：=]\s*/,'').trim();
   if(subs.length)back=(back+' '+subs.map((s,i)=>(i+1)+') '+s).join('  ')).trim();
   const front=ft.replace(/[:：=]\s*$/,'');
   if(back.length>3&&front.length<90)out.push({f:front,b:back,n:d.name});
  });
 });
 return out;
}
function mkDeck(){deck=allCards();known=0;ci=0;flip=false}
function showCard(){
 $('cards').style.setProperty('--p',(known+deck.length?known/(known+deck.length)*100:0)+'%');
 const c=$('card');
 if(!deck.length){c.className='';c.textContent=known?'Hepsini bitirdin! "Baştan başla" ile tekrar çalış.':'Kart bulunamadı. Notlarda "**Kavram:** açıklama" biçiminde satırlar olmalı.';$('cn').textContent=known+' bildim';return}
 ci=(ci+deck.length)%deck.length;const k=deck[ci];
 c.className=flip?'back':'';c.textContent=flip?k.b:k.f;
 $('cn').textContent=(ci+1)+' / '+deck.length+' · bildim: '+known;
}
const doFlip=()=>{flip=!flip;showCard()};
const go=n=>{ci+=n;flip=false;showCard()};
$('card').onclick=doFlip;$('cflip').onclick=doFlip;$('cprev').onclick=()=>go(-1);$('cnext').onclick=()=>go(1);
$('cknow').onclick=()=>{if(!deck.length)return;deck.splice(ci,1);known++;flip=false;showCard()};

$('shuf').onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}ci=0;flip=false;showCard()};

async function restoreJson(f){
 try{
  const o=JSON.parse(await f.text());
  let inc;
  if(Array.isArray(o.courses))inc=o.courses;
  else if(Array.isArray(o.docs))inc=[{id:null,docs:o.docs}];/* eski (v1) yedek: açık derse eklenir */
  else throw 0;
  const clean=ds=>(Array.isArray(ds)?ds:[]).filter(d=>d&&typeof d.md==='string'&&d.id!=null).map(d=>({id:String(d.id),name:String(d.name||'Not'),md:d.md,inc:d.inc!==false,hl:Array.isArray(d.hl)?d.hl:[]}));
  const nd=inc.reduce((n,c)=>n+clean(c.docs).length,0);
  if(!confirm(nd+' not ('+inc.length+' ders) geri yüklensin mi?\nAynı kimlikli notların üzerine yazılır, diğerleri korunur.'))return;
  const ph=(Array.isArray(o.courses)&&courses.length===1&&!courses[0].docs.length)?courses[0]:null;/* boş başlangıç dersi */
  inc.forEach(c=>{
   let tg=c.id!=null?courses.find(x=>x.id===String(c.id)):crs();
   if(!tg){tg={id:String(c.id),name:String(c.name||'Ders'),docs:[],act:null,t:String(c.t||''),s:String(c.s||''),ex:String(c.ex||'')};courses.push(tg)}
   clean(c.docs).forEach(n=>{const i=tg.docs.findIndex(x=>x.id===n.id);if(i>=0)tg.docs[i]=n;else tg.docs.push(n)});
  });
  if(o.opt&&typeof o.opt==='object'){const {t,s:_s,...ro}=o.opt;Object.assign(opt,ro)}
  if(ph&&courses.length>1){courses.splice(courses.indexOf(ph),1);const t=courses.find(c=>c.id===String(o.ac))||courses[0];enterCourse(t.id,true);smode='courses'}
  if(!cur()&&docs[0])act=docs[0].id;
  syncUi();
 }catch(e){alert('Bu dosya geçerli bir yedek değil.')}
}

/* ---------- PDF (A4, 14mm kenar => 182x269mm) ---------- */
const FULL=269/25.4*96,PH=FULL*0.9,PW=182/25.4*96;
const setU=(u,z)=>{u.style.zoom='';u.style.width=(PW/z)+'px'};
const hU=(u,z)=>{setU(u,z);return u.offsetHeight*z};
function fit(u){if(hU(u,1)<=PH)return 1;let lo=.2,hi=1;for(let i=0;i<20;i++){const m=(lo+hi)/2;hU(u,m)<=PH?lo=m:hi=m}return lo}
function beforePrint(){
 setPn();setDocTitle();view.classList.remove('dk');if(window.CSS&&CSS.highlights)CSS.highlights.clear();
 Object.assign(page.style,{padding:'0',boxShadow:'none',maxWidth:'none',margin:'0'});
 page.querySelectorAll('.unit').forEach(u=>{
  let z=opt.sc==='auto'?fit(u):parseFloat(opt.sc);
  setU(u,z);u.style.zoom=z;
  if(opt.sc==='auto'){let n=0;while(n++<40&&u.getBoundingClientRect().height>FULL*0.97&&z>.2){z*=.97;setU(u,z);u.style.zoom=z}}
 });
}
function afterPrint(){
 ['padding','boxShadow','maxWidth','margin'].forEach(k=>page.style[k]='');
 page.querySelectorAll('.unit').forEach(u=>{u.style.zoom='';u.style.width=''});
 view.classList.toggle('dk',!!opt.dk);applyFind();
}
window.addEventListener('beforeprint',beforePrint);window.addEventListener('afterprint',afterPrint);
$('pdf').onclick=()=>{if(isM())setPane('not');else if(tab==='cards')setTab('not');setTimeout(()=>window.print(),50)};

/* ---------- başlangıç ---------- */
if(!docs.length){const old=LS('note',null);try{const o=localStorage.getItem('note');if(o){addDoc('Notum',o)}}catch(e){}}
if(!cur()&&docs[0])act=docs[0].id;
applyUi();side();loadEd();render();

/* ---------- mobil / masaüstü düzeni ---------- */
const mq=matchMedia('(max-width:860px)');
function isM(){return mq.matches}
const hg1=$('hg1'),hg2=$('hg2'),bar=document.querySelector('.bar'),hdr=document.querySelector('header'),ms=$('msheet');
function setPane(p){
 document.body.dataset.pane=p;document.body.classList.remove('sheet');
 document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('on',b.dataset.m===p));
 if(p==='not'||p==='quiz'||p==='cards')setTab(p);
}
function layout(){
 if(isM()){ms.append(hg1,hg2,bar);if(!document.body.dataset.pane)setPane(cur()?'not':'list');else setPane(document.body.dataset.pane)}
 else{hdr.insertBefore(hg1,hdr.querySelector('.tabs'));hdr.insertBefore(hg2,$('gear'));hdr.after(bar);document.body.classList.remove('sheet');delete document.body.dataset.pane}
}
document.querySelectorAll('#mnav button').forEach(b=>b.onclick=()=>setPane(b.dataset.m));
$('gear').onclick=()=>document.body.classList.toggle('sheet');
$('mbd').onclick=()=>document.body.classList.remove('sheet');
let wasNotes=false;
$('list').addEventListener('click',()=>{wasNotes=smode==='notes'},true);
$('list').addEventListener('click',e=>{if(isM()&&wasNotes&&e.target.closest('.item')&&!e.target.dataset.a)setPane('not')});
$('addb').addEventListener('click',()=>{const n=smode==='notes';wasNotes=n;if(isM()&&n)setPane('edit')},true);
$('file').addEventListener('change',()=>{if(isM())setTimeout(()=>setPane('not'),300)});
if(mq.addEventListener)mq.addEventListener('change',layout);
layout();syncEx();setDocTitle();
</script>
